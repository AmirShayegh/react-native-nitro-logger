buildscript {
  ext.NitroLogger = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return NitroLogger[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

/**
 * Whether the consuming app is on the new architecture.
 *
 * Read the same way `react-native-nitro-modules` reads it, so the two cannot
 * disagree about the app they are both in. It decides one thing here: whether
 * `NitroLoggerLifecycle` is registered as a TurboModule, which is how the app's
 * module system decides to create it at all.
 */
def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/nitrologger+autolinking.gradle'

apply plugin: "com.facebook.react"

android {
  namespace "com.margelo.nitro.nitrologger"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    // For `AndroidPlatformIoTest`, which is the only thing in this library that
    // needs a device: it exercises the `android.system.Os` implementation of
    // `PlatformIo`, whose whole job is the syscalls a JVM cannot make.
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests {
      // The writer imports nothing from `android.*` — every syscall it needs
      // is behind `PlatformIo` — so its suite is plain JUnit on the JVM and
      // needs neither a device nor Robolectric. This flag only covers the
      // stray android.* symbol reached through a shared constant.
      returnDefaultValues = true

      all {
        // Where `spec/file-sink-lifecycle.rows.json` is, for the suite that
        // reads it. A JVM unit test's working directory is whatever the Gradle
        // worker chose and is not the repository, so the path has to be handed
        // in. Derived from `projectDir` rather than `rootProject`, because this
        // module is the root project when the library builds standalone and a
        // subproject when the example app builds it.
        systemProperty "nitroLogger.repoRoot", projectDir.parentFile.absolutePath

        // And the table is a real input, not just a path. Without this the task
        // is UP-TO-DATE after the table changes — its sources and classpath did
        // not move — so editing a row and re-running reports a pass from the
        // previous table. Found by red-proofing the row table: Jest and
        // SwiftPM both went red on a new row and Gradle did not, because it
        // never ran. A shared contract that one of its three consumers can
        // silently decline to re-read is not shared.
        inputs.file(new File(projectDir.parentFile, "spec/file-sink-lifecycle.rows.json"))
          .withPropertyName("fileSinkLifecycleRows")
          .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)

        // The wire contract is consumed by a JVM suite exactly as the shared
        // lifecycle table is. Make both files task inputs so changing either
        // cannot hand back yesterday's UP-TO-DATE result.
        inputs.files(
          new File(projectDir.parentFile, "spec/wire/v1/contract.json"),
          new File(projectDir.parentFile, "spec/wire/v1/golden-vectors.json")
        )
          .withPropertyName("wireContractV1")
          .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")

  testImplementation "junit:junit:4.13.2"

  // For reading `spec/file-sink-lifecycle.rows.json`. Test-only, so it appears
  // in no published metadata. Deliberately not `org.json`: that package exists
  // as a stub inside `android.jar`, and which of the two wins on a unit-test
  // classpath is an ordering detail — the stub's methods throw, so losing the
  // coin toss turns the shared table into a suite that cannot load it.
  testImplementation "com.google.code.gson:gson:2.11.0"

  // Deliberately not Robolectric. Robolectric shadows `android.system.Os`, so a
  // suite written against it would replace zero coverage of `AndroidPlatformIo`
  // with coverage of a *different* implementation — which is the defect this
  // suite exists to close, restated.
  androidTestImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
