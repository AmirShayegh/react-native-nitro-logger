name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      # The documented ESLint setup, exercised the way a stranger would: packed
      # tarball, fresh dependency tree, temp directory outside this repository.
      #
      # This job cannot see the bug it exists for by linting in-repo. Our own
      # eslint.config.mjs inherits `files` and a TypeScript parser from
      # @react-native/eslint-config, which supplies exactly what the shipped
      # config was missing — so CI stayed green through two releases while the
      # published config lint nothing in a TypeScript app.
      - name: Verify the documented ESLint setup lints TypeScript
        run: yarn check-eslint-consumer

      # Which built file each of `require`, `import` and Jest actually gets.
      # Through 0.1.2 the package shipped ESM only, so a React Native app's
      # stock Jest died with "Cannot use import statement outside a module"
      # before running a test. In-repo nothing sees that: workspace links and
      # the `-source` export condition resolve to src/, so the shipped export
      # map is never the one exercised.
      - name: Verify every consumer entry point resolves
        run: yarn check-package-exports

      # Decode the exact bytes emitted by TypeScript with Go's standard JSON
      # implementation. This pins Unicode-scalar and integer-bound behavior at
      # the language boundary before the gateway registration work lands.
      - name: Decode the analytics grammar in Go
        run: yarn check-analytics-grammar-go

      # Every ```ts block in the shipped docs, compiled against this tree.
      # A sample is the first thing a reader copies, so a renamed export should
      # break the documentation at the same moment it breaks the code rather
      # than whenever someone next reads it.
      #
      # The companion link check is deliberately not here: it makes real
      # network requests, and a rate-limited runner would turn unrelated pull
      # requests red. It runs before publishing instead — see
      # scripts/check-doc-links.sh.
      - name: Typecheck the documentation samples
        run: yarn check-docs

      # The consumer apps the min-rn jobs write out are TypeScript inside a
      # shell heredoc, so `lint` and `typecheck` above cannot see them. 0.3.0
      # moved `createFileSink` to a subpath export, both templates kept
      # importing it from the root, and the first thing that noticed was
      # min-rn-android failing after 7m34s of emulator time. Two seconds here
      # instead.
      - name: Typecheck the min-rn harness apps
        run: yarn check-harness

      # `eslint` above covers .js/.ts/.tsx and nothing else, so the 22 shell
      # scripts that hold most of this repository's gates are unparsed until
      # something runs them — and several only run inside the emulator and
      # simulator jobs, so an unterminated heredoc or a stray `fi` costs
      # minutes to discover. `bash -n` parses without executing. The floor is
      # there because a glob that matched nothing would otherwise pass.
      - name: Syntax-check the shell scripts
        run: |
          count=0
          for f in scripts/*.sh; do bash -n "$f"; count=$((count + 1)); done
          if [ "$count" -lt 23 ]; then
            echo "FAIL: parsed only $count scripts; the glob is not matching"
            exit 1
          fi
          echo "ok: $count shell scripts parse"

      # The counts `docs/PARITY.md` states, against the floors CI enforces.
      # Needs no test run, which is why it sits here rather than in the three
      # matrix jobs: it checks the document against the gate, and the gate
      # checks itself against a real report.
      - name: Check the parity counts
        run: yarn check-parity-counts

      # The git tag the podspec points at must be the tag the release creates.
      # Through 0.1.2 it interpolated a bare "0.1.2" while Changesets tags
      # `react-native-nitro-logger@0.1.2`, so a CocoaPods consumer installing
      # from git resolved a tag that had never existed in any release.
      - name: Check the podspec points at a tag that will exist
        run: yarn check-podspec-tag

  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      # Not a bare `yarn test`. Jest reports success for a run that discovered
      # nothing — a moved directory, a config change, a `testMatch` that stops
      # matching — so the count is asserted against a floor and every suite
      # that is meant to exist has to report. See scripts/check-test-reports.sh.
      - name: Run the TypeScript suite
        run: yarn check-test-reports js

      # A green suite says the tests agree with the code, not that they would
      # notice if it changed. This reintroduces sixteen real defects and
      # requires the named test to fail for each. ~30s, and it runs here
      # rather than as its own job because it needs exactly this setup.
      - name: Prove the pinned defects are still caught
        run: ./scripts/check-mutants.sh

      # And the third question: not "do the tests agree", not "would they
      # notice", but "is there anything they never look at". Ratchets two
      # points below what the suite measures, per directory as well as
      # globally, because a global number lets one well-covered area pay for
      # an untested one. Runs the suite a second time — a couple of seconds,
      # and worth not folding into the run above, whose job is the count.
      #
      # `yarn test:coverage` is two things: the thresholds, and
      # check-coverage-groups.sh behind them. The second is what stops the
      # first from quietly changing meaning — see its header.
      - name: Check coverage has not drained out of a directory
        run: yarn test:coverage

  # The vendored iOS writer, under XCTest rather than on a simulator.
  #
  # `Package.swift` builds it without the Nitro adapter precisely so this job
  # can exist: rotation, retention, purge fencing, secure-create, short-write
  # recovery, and the 10k burst all run here in a couple of seconds. The
  # simulator build below proves the bridge compiles; this proves the writer is
  # correct, and the two are not substitutes.
  test-swift:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # See test-js above for why this is not a bare `swift test`. Invoked
      # directly rather than through yarn: this job deliberately has no Setup
      # step — the Swift package needs no JavaScript toolchain — and the script
      # needs only bash, swift and python3.
      - name: Run the Swift suite
        run: ./scripts/check-test-reports.sh swift

  # The vendored Android writer, on the JVM rather than on an emulator.
  #
  # The same bargain as `test-swift`: every syscall the writer needs is behind
  # `PlatformIo`, so it imports nothing from `android.*` and its rotation,
  # retention, purge fencing, byte reservation, short-write recovery and
  # crash-tail trim all run here in seconds. `build-android` below proves the
  # Nitro adapter compiles; this proves the writer is correct, and the two are
  # not substitutes.
  test-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate nitrogen code
        run: yarn nitrogen

      # See test-js above. Gradle adds its own version of the problem: a task
      # it considers UP-TO-DATE does not execute, and the reports left from
      # last time look exactly like reports from this time. Deleting them first
      # is what makes the task run and what makes the count mean something.
      - name: Run the Kotlin suite
        run: yarn check-test-reports kotlin

  # `AndroidPlatformIo` — the only part of the Android writer that is not
  # JVM-testable, and through 0.1.2 the only part in no test at all.
  #
  # `test-android` above exercises `PlatformIo.Jvm`: a *different*
  # implementation of the same interface, written for the desktop JVM. Every
  # `android.system.Os` call the library actually makes on a device was
  # uncovered while that job's green tick read as "the Android writer is
  # tested". Robolectric would not have closed it either — it shadows
  # `android.system.Os`, so the suite would cover a third implementation.
  #
  # Two API levels, and the low one is not ceremony. `java.nio.file` is API 26
  # and this library supports 24, so `PlatformIo.Jvm.Nio` is held in a separate
  # nested object precisely so that `AndroidPlatformIo`'s `restrictToOwner`
  # fallback can resolve `Jvm` without dragging it in. If that split ever
  # breaks, the symptom is a `NoClassDefFoundError` — an `Error`, which passes
  # straight through every `catch (Exception)` in the file — and API 24 is the
  # only place it is observable.
  test-android-instrumented:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate nitrogen code
        run: yarn nitrogen

      # The runner image ships KVM but leaves it root-only; without this the
      # emulator silently falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # `default` carries the Google APIs images' extras without their
          # size; `google_apis` is only needed for Play Services, which this
          # library does not touch.
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # A single ABI, because the emulator only runs one and building the
          # other three is minutes of NDK work for artifacts nothing installs.
          script: ORG_GRADLE_PROJECT_reactNativeArchitectures=x86_64 ./scripts/check-android-instrumented.sh

  test-android-reload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 only, and not folded into the instrumented matrix. That suite
      # asks whether the writer's syscalls work on an old OS; this one asks what
      # the registry does when a React instance is destroyed, which is React
      # Native's behaviour rather than the platform's. API 24 would double the
      # cost for no signal, and this job is the slower of the two — it builds
      # the example app in release, which bundles JavaScript.
      - name: Run the reload harness
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ORG_GRADLE_PROJECT_reactNativeArchitectures=x86_64 ./scripts/check-android-reload.sh

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      # The documentation samples again, this time resolved the way `exports`
      # sends a consumer: through `lib/typescript/**` rather than through
      # `src/index.tsx`. The `lint` job checks the source surface, which is the
      # right place for it — a renamed export should break the docs in the
      # commit that renames it. What it cannot see is a type that the source
      # exports and the declaration build drops, which typechecks there and
      # fails for every reader.
      - name: Typecheck the documentation against the published surface
        run: yarn check-docs-lib

      # And the harness apps against that same surface, for the same reason —
      # more sharply here, because these apps really do install the packed
      # tarball, so `lib/typescript/**` is not a stand-in for what they resolve.
      # It is what they resolve.
      - name: Typecheck the min-rn harness apps against the published surface
        run: yarn check-harness-lib

      # Which entry points a stock app at the MINIMUM React Native can bundle.
      # `check-package-exports` above runs Node's resolver and tsc, both of
      # which honour `exports` unconditionally, so every entry point passes
      # there — while Metro 0.81, which react-native 0.78 pins, ships with
      # subpath exports off and cannot resolve `/unstable` at all. This builds
      # real bundles against the stock template config to pin that, and to pin
      # that the documented one-line workaround still works.
      - name: Check the export map resolves at the minimum React Native
        run: yarn check-metro-resolution

      # Every `__DEV__` in the built library is a place redaction can be turned
      # off. The set is meant to be small and unchanging; this fails if it grows
      # without anyone deciding it should, and — just as importantly — if an
      # allowlisted gate disappears, which would quietly make the release-bundle
      # job below prove nothing.
      - name: Inventory the dev-only branches
        run: ./scripts/check-dev-branches.sh

      # Executes-only, never a gate on numbers: a shared runner's timings are
      # noise, but a bench case that stops constructing — an export it names
      # renamed, an option shape changed — is a real failure that would
      # otherwise surface mid-measurement on somebody's laptop. This job is
      # where `lib/commonjs` was just built, which is what the bench requires.
      - name: Check every bench case still executes
        run: node bench/run.js --quick

  # Proves the reveal branches are not in shipped JavaScript.
  #
  # `__DEV__` gating is the design; this is the check that it is also the
  # reality. A refactor that moved a reveal behind a runtime flag, or a bundler
  # configured without the substitution, would leave the branch in the release
  # bundle and nothing else in the build would notice.
  privacy-release-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bundle with --dev false and check for reveal sentinels
        run: ./scripts/check-release-bundle.sh

      # The check above bundles from example/, whose metro.config.js sets
      # `conditions: ['react-native-nitro-logger-source']` and therefore
      # resolves src/index.tsx. A real app has only the `react-native`
      # condition and gets lib/module/index.js — a different file, produced by
      # a different toolchain. So the check above has never said anything about
      # what ships. This one rebuilds lib/, packs, installs into an app outside
      # the monorepo, and inspects the artifact that app actually bundles.
      - name: Check the artifact consumers bundle
        run: ./scripts/check-release-bundle-consumer.sh

  # Backs the "iOS ≥ 0.78" compatibility claim with an actual run.
  #
  # `build-ios` builds the example, which tracks the newest React Native — so it
  # says nothing about the bottom of the supported range, which is where the
  # claim is either true or false. This installs a `yarn pack` tarball into a
  # pristine 0.78 app, builds it Release, launches it on a simulator, and reads
  # the verdict back out of the app container. Packing rather than linking means
  # the `files` list is under test too.
  #
  # Not on the critical path for most changes, but it is the only job that would
  # notice a podspec, a React header, or a Nitro binding that stopped working on
  # the oldest version anyone is told to expect.
  min-rn-ios:
    # Xcode 16, not the 26 the example builds with, and not `macos-latest`.
    #
    # React Native 0.78 pins `fmt 11.0.2` through RCT-Folly, and clang from
    # Xcode 26 rejects its `format-inl.h`. That is upstream and unrelated to
    # this library — but it also is not a combination any consumer is in. An
    # app on 0.78 builds with the toolchain 0.78 shipped against, so that is
    # what the compatibility claim is verified on. Raising the floor above 0.78
    # is what would let this job move to a newer runner.
    runs-on: macos-15

    env:
      XCODE_VERSION: '16.4'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use the Xcode the minimum React Native supports
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build, launch and exercise on the minimum React Native
        run: ./scripts/check-min-rn-ios.sh

  # The Android half of the same claim. Separate job rather than a matrix leg of
  # `min-rn-ios`, because the two need different runners: that one is pinned to
  # macos-15 with Xcode 16 for a toolchain reason that has no Android analogue.
  #
  # Also separate from `test-android-reload`, which is the other job that boots
  # an emulator and installs a release build. That one drives the maintained
  # example on the newest React Native and reaches into the registry's own test
  # hooks; this one asks whether a consumer who has never heard of those hooks
  # can install the package and have it work. Sharing a job would mean one
  # failure standing for either question.
  min-rn-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      # Nothing in this job builds this repository's Android module — it builds
      # a tarball of the published package inside a scaffolded consumer — but
      # `yarn prepare` runs from the script and the generated sources have to
      # exist before it packs them.
      - name: Generate nitrogen code
        run: yarn nitrogen

      # The runner image ships KVM but leaves it root-only; without this the
      # emulator silently falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 only. The minimum-OS claim belongs to
      # `test-android-instrumented`, which runs its matrix down to API 24; this
      # job's variable is the React Native version, so pinning the OS is what
      # makes a failure here unambiguous. The script reads the ABI off the
      # device rather than taking it from here, so there is one place that
      # decides it.
      - name: Build, launch and exercise on the minimum React Native
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/check-min-rn-android.sh

  nitrogen-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Regenerate nitrogen code
        run: yarn nitrogen

      # `nitrogen/` is tracked, so this now does what its name says. While it
      # was gitignored there was nothing for the regenerated output to differ
      # from, and the job passed no matter how far the bindings had drifted
      # from the `.nitro.ts` specs.
      #
      # Committing generated code is a real cost — every spec change carries a
      # regenerated diff — and it buys the one thing nothing else here provides:
      # a spec edited without regenerating fails on this line rather than at
      # some later compile whose error names a file nobody wrote by hand.
      # Generation is deterministic, so a clean tree stays clean.
      - name: Verify regeneration matches what is committed
        run: |
          # `git diff` does not look at untracked files, so a brand-new spec
          # whose bindings were never committed would produce only new files
          # and slip through. Adding nitrogen/ with --intent-to-add first makes
          # those additions part of the diff. Today a new spec also rewrites the
          # tracked autolinking manifests, so this would fail either way — that
          # is luck, not a guarantee, and this does not depend on it.
          git add --intent-to-add --all nitrogen/
          git diff --exit-code

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      # Unconditional, deliberately. These used to be skipped when a probe step
      # ran `turbo --dry=json` and reported a cache HIT — but the probe and the
      # build below are two separate turbo invocations computing two separate
      # hashes, and turbo 2.10.7 returns one of two hashes at random for an
      # untouched tree (documented at length in turbo.json). A hit on the
      # probe's hash and a miss on the build's is a perfectly reachable pair,
      # and it means gradle running with no JDK installed. The setup costs
      # minutes; a green build that compiled nothing costs more.
      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # The step above builds the example app in **debug**, which is what
      # `react-native build-android` defaults to — and a debug build never
      # compares the classes it dexes. That is how ~90 of React Native's own
      # generated spec classes came to be compiled into this library's artifact
      # and shipped through 0.1.3, breaking every consumer's *release* build on
      # a duplicate-class error while this job stayed green.
      - name: Check what the Android artifact contains
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: ./scripts/check-android-packaging.sh

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for iOS
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      # Unconditional, for the reason spelled out in the Android job above: the
      # probe that used to gate these computed a different hash from the build
      # that follows, so a hit on one and a miss on the other left `xcodebuild`
      # running against a project CocoaPods had never been through.
      #
      # The pod install step additionally carried `steps.cocoapods-cache.outputs
      # .cache-hit != 'true'`, naming a step id that does not exist in this
      # workflow. An expression over a missing step is empty, never 'true', so
      # that half of the condition was inert — it read as a guard and guarded
      # nothing.
      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

