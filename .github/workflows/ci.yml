name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run the TypeScript suite
        run: yarn test

  # The vendored iOS writer, under XCTest rather than on a simulator.
  #
  # `Package.swift` builds it without the Nitro adapter precisely so this job
  # can exist: rotation, retention, purge fencing, secure-create, short-write
  # recovery, and the 10k burst all run here in a couple of seconds. The
  # simulator build below proves the bridge compiles; this proves the writer is
  # correct, and the two are not substitutes.
  test-swift:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run the Swift suite
        run: swift test

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      # Every `__DEV__` in the built library is a place redaction can be turned
      # off. The set is meant to be small and unchanging; this fails if it grows
      # without anyone deciding it should, and — just as importantly — if an
      # allowlisted gate disappears, which would quietly make the release-bundle
      # job below prove nothing.
      - name: Inventory the dev-only branches
        run: ./scripts/check-dev-branches.sh

  # Proves the reveal branches are not in shipped JavaScript.
  #
  # `__DEV__` gating is the design; this is the check that it is also the
  # reality. A refactor that moved a reveal behind a runtime flag, or a bundler
  # configured without the substitution, would leave the branch in the release
  # bundle and nothing else in the build would notice.
  privacy-release-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bundle with --dev false and check for reveal sentinels
        run: ./scripts/check-release-bundle.sh

  # Backs the "iOS ≥ 0.78" compatibility claim with an actual run.
  #
  # `build-ios` builds the example, which tracks the newest React Native — so it
  # says nothing about the bottom of the supported range, which is where the
  # claim is either true or false. This installs a `yarn pack` tarball into a
  # pristine 0.78 app, builds it Release, launches it on a simulator, and reads
  # the verdict back out of the app container. Packing rather than linking means
  # the `files` list is under test too.
  #
  # Not on the critical path for most changes, but it is the only job that would
  # notice a podspec, a React header, or a Nitro binding that stopped working on
  # the oldest version anyone is told to expect.
  min-rn-ios:
    # Xcode 16, not the 26 the example builds with, and not `macos-latest`.
    #
    # React Native 0.78 pins `fmt 11.0.2` through RCT-Folly, and clang from
    # Xcode 26 rejects its `format-inl.h`. That is upstream and unrelated to
    # this library — but it also is not a combination any consumer is in. An
    # app on 0.78 builds with the toolchain 0.78 shipped against, so that is
    # what the compatibility claim is verified on. Raising the floor above 0.78
    # is what would let this job move to a newer runner.
    runs-on: macos-15

    env:
      XCODE_VERSION: '16.4'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use the Xcode the minimum React Native supports
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build, launch and exercise on the minimum React Native
        run: ./scripts/check-min-rn-ios.sh

  nitrogen-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Regenerate nitrogen code
        run: yarn nitrogen

      # `nitrogen/` is gitignored, so scoping this to that directory asserted
      # nothing and passed vacuously. Checking the whole tree is the real test:
      # generation must not touch anything tracked, and if the bindings are
      # ever committed this starts catching spec drift without further edits.
      #
      # What actually catches a stale binding today is compilation — the iOS
      # and Android jobs both regenerate before they build, which is how a
      # hand-written adapter that drifted from a changed spec gets found.
      - name: Verify regeneration touches nothing tracked
        run: git diff --exit-code

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for iOS
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

